# Outer reverse proxy in front of the amazon-oa container (which listens on
# port 8080). Mount the app at /site/ AND proxy /images/ and /video/ — the page
# loads screenshots as ../images/... which the browser resolves outside /site/,
# and the state-sync API is reached as a relative site/api/state path.
#
# Put this block inside your TLS (or http) server block, next to your existing
# server listeners.

# --- the app itself ------------------------------------------------
location ^~ /site/ {
    proxy_pass http://127.0.0.1:8080;      # no URI → request path is passed through
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
    # Pyodide streams .wasm over the same connection; don't let the buffer starve
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# --- screenshots and figures (../images/... from site/index.html) ---
location ^~ /images/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

# --- video transcripts / stills ------------------------------------
location ^~ /video/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}