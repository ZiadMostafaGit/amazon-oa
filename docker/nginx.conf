server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Keep redirects relative. Without this nginx builds an absolute Location
    # from the port it listens on *inside* the container (80), so a host
    # mapping like -p 8080:80 sends the browser to localhost:80 and it fails.
    absolute_redirect off;

    # the app lives under /site/ because its HTML refers to ../images/
    location = / { return 302 /site/; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Pyodide streams its runtime; without the right type the browser falls back
    # to a slower path and warns. default_type only applies if mime.types missed it.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # vendored assets are content-addressed by version and never change in place
    location /site/vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/wasm image/svg+xml;

    access_log off;
}
