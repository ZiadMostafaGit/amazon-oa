services:
  fastprep:
    build: .
    image: fastprep-practice:latest
    container_name: fastprep-practice
    ports:
      - "8900:8900"
    restart: unless-stopped
    volumes:
      - fastprep-data:/data          # progress.db + the screenshot cache

    # The runner sandboxes your code with bubblewrap, which has to create user
    # and network namespaces. Docker's default seccomp profile blocks that, so
    # without these two lines the app starts with NO namespace isolation and
    # says so in its startup banner and in the header.
    #
    # The trade-off is real and it is yours to make: you are loosening the
    # container in order to get a sandbox inside it. If you would rather not,
    # delete both lines and treat the container itself as the boundary - but
    # then user code shares the container's network namespace and can reach
    # whatever the container can reach.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

volumes:
  fastprep-data:
