<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Self-test — Python runtime and every published solution</title>
<style>
 body{background:#0e0e0e;color:#d8d8d8;font:14px/1.6 "JetBrains Mono",ui-monospace,monospace;padding:24px}
 h1{font-size:16px;color:#fff;margin:0 0 4px}
 p.sub{color:#8a8a8a;margin:0 0 18px}
 pre{white-space:pre-wrap;margin:0}
 .ok{color:#4ade80}.bad{color:#ff6b6b}.note{color:#8a8a8a}
</style>
</head>
<body>
<h1>Self-test</h1>
<p class="sub">Boots the Python runtime the same way the app does, then runs every problem's
published solution against its own cases. Open this page whenever the runtime or the server
configuration changes. It is excluded from the container image.</p>
<pre id="out" class="note">running…</pre>

<script src="problems.js"></script>
<script src="pyrun.js"></script>
<script>
(async function () {
  const out = document.getElementById('out');
  const log = [];
  const say = (line, cls) => {
    log.push(line);
    out.innerHTML = log.map(l => '<span class="' + (cls && l === line ? cls : '') + '">' +
                                 l.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) +
                                 '</span>').join('\n');
  };
  /* When served by server.py, mirror the verdict into the state file so a
     headless run can be read from the shell. Harmless without a backend. */
  const report = (r) => fetch('api/state', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                            body: JSON.stringify({e2e: JSON.stringify(r)})}).catch(() => {});
  const unescapeHtml = (s) => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
  const solutionOf = (body) => {
    const m = /<details class="sol">[\s\S]*?<pre class="sample"><code>([\s\S]*?)<\/code><\/pre>/.exec(body);
    return m ? unescapeHtml(m[1]) : null;
  };

  try {
    const t0 = Date.now();
    await window.PyRun.ready((m) => say(m));
    say('runtime booted in ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s');

    const runnable = window.PROBLEMS.filter(p => p.tests && p.fn);
    const failing = [];
    let cases = 0;
    for (const p of runnable) {
      const code = solutionOf(p.body);
      if (!code) { failing.push(p.id + ' (no solution code)'); continue; }
      const res = window.PyRun.tests(code, p.fn.name, p.tests, 5);
      cases += p.tests.length;
      if (res.error) failing.push(p.id + ' (' + res.error.split('\n').pop() + ')');
      else {
        const bad = res.results.map((r, i) => r.ok ? null : i + 1).filter(x => x);
        if (bad.length) failing.push(p.id + ' (cases ' + bad.join(', ') + ')');
      }
    }
    say(runnable.length + ' entries, ' + cases + ' cases — ' +
        (failing.length ? failing.length + ' FAILING: ' + failing.join('; ') : 'all pass'),
        failing.length ? 'bad' : 'ok');

    const p = window.PROBLEMS.find(x => x.gen && x.tests);
    const code = solutionOf(p.body);
    const d = window.PyRun.diff(code, code, p.gen, p.fn.name, {trials: 100, maxN: 9, limit: 2, budget: 6});
    say('Random mode on ' + p.id + ': ' + (d.error || d.checked + ' generated inputs, ' +
        (d.failed ? 'DISAGREED' : 'agreed')), d.error || d.failed ? 'bad' : 'ok');
    const r = window.PyRun.run('print(sum(range(10)))', 5);
    say('Run mode: ' + JSON.stringify(r.printed) + (r.error ? ' ' + r.error : ''), r.error ? 'bad' : 'ok');
    say(failing.length ? 'FAILED' : 'ALL GOOD', failing.length ? 'bad' : 'ok');
    report({ok: !failing.length, log: log});
  } catch (e) {
    say('FAILED TO START: ' + ((e && e.message) || e), 'bad');
    report({ok: false, log: log, error: String((e && e.message) || e)});
  }
})();
</script>
</body>
</html>
