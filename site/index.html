<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon OA Practice</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<style>
:root{
  --bg:#0e0e0e; --panel:#131313; --panel2:#1a1a1a; --line:#2b2b2b;
  --mono:"JetBrains Mono","Cascadia Code","Fira Code",Consolas,"Liberation Mono",monospace;
  --efs:14px;
  --txt:#d8d8d8; --txt-strong:#ffffff; --txt-dim:#9a9a9a;
  --accent:#ff9900; --green:#1ea672; --blue:#3b82f6;
  --code-bg:#1c1c1c;
  --rail:56px; --top:52px;
  --pfs:17px;            /* problem-statement text size (A- / A+ in the header) */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:"Amazon Ember","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:#6ea8fe}

/* ---------- top bar ---------- */
#top{
  height:var(--top); display:flex; align-items:center; gap:14px;
  padding:0 14px; background:#161616; border-bottom:1px solid var(--line);
  position:relative; z-index:40;
}
#burger{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#bbb}
#burger:hover{background:#242424}
.smile{display:flex;flex-direction:column;line-height:1;user-select:none}
.smile b{font-size:19px;letter-spacing:-.5px;color:#fff;font-weight:700}
.smile svg{margin-top:-3px}
#topTitle{font-size:13px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topTitle b{color:#e8e8e8;font-weight:600}
.spacer{flex:1}
#timer{
  display:flex;align-items:center;gap:7px;background:#123d2c;color:#4ade80;
  border:1px solid #1c5c42;border-radius:16px;padding:5px 13px;font-size:13px;
  font-variant-numeric:tabular-nums;cursor:pointer;
}
#timer.paused{background:#3a2a12;color:#fbbf24;border-color:#5c4118}
#timer.over{background:#40191c;color:#f87171;border-color:#5c2226}
.tbtn{padding:6px 12px;border-radius:5px;font-size:13px;color:#c8c8c8;border:1px solid var(--line)}
.tbtn:hover{background:#242424;color:#fff}

/* ---------- layout ---------- */
#shell{display:flex;height:calc(100vh - var(--top))}
#rail{
  width:var(--rail);flex:0 0 var(--rail);background:#161616;border-right:1px solid var(--line);
  overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:9px;
}
#rail .rl{width:20px;height:1px;background:#333;margin:9px 0 5px;flex:0 0 auto}
#rail .rl:first-child{margin-top:0;height:0}
#rail .rl.cur{background:var(--accent);width:24px;height:2px}
.qdot{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;color:#9a9a9a;border:1px solid transparent;flex:0 0 auto;
}
.qdot:hover{background:#242424;color:#ddd}
.qdot.active{background:var(--blue);color:#fff;font-weight:600}
.qdot.st-attempt{border-color:#5c4118;color:#fbbf24}
.qdot.st-solved{border-color:#2b5c40;color:#4ade80}
.qdot.st-review{border-color:#5c2226;color:#f87171}
.qdot.active{border-color:transparent;color:#fff}

#main{flex:1;display:flex;min-width:0}
#left{
  flex:0 0 52%; min-width:280px; overflow-y:auto; background:var(--bg);
  border-right:1px solid var(--line);
}
#drag{flex:0 0 5px;cursor:col-resize;background:#161616}
#drag:hover{background:var(--blue)}
#right{flex:1;min-width:280px;display:flex;flex-direction:column;background:#0b0b0b}

/* ---------- problem pane ---------- */
#phead{
  position:sticky;top:0;z-index:10;background:#131313;border-bottom:1px solid var(--line);
  padding:9px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
#phead .eyebrow{font-size:10.5px;letter-spacing:.14em;color:#8a8a8a;text-transform:uppercase;font-weight:700}
#phead .score{margin-left:auto;font-size:12px;color:var(--txt-dim)}
.chip{
  font-size:11px;padding:3px 9px;border-radius:11px;border:1px solid var(--line);
  color:#9a9a9a;background:#1a1a1a;white-space:nowrap
}
.chip.src{cursor:pointer}
.chip.src:hover{color:#fff;border-color:#4a4a4a}
#pbody{padding:26px 30px 90px;max-width:860px;font-size:var(--pfs)}

.qtitle{display:flex;align-items:center;gap:11px;margin:0 0 20px}
.qtitle svg{flex:0 0 auto;opacity:.85}
.qtitle h1{margin:0;font-size:25px;font-weight:700;color:#fff;letter-spacing:-.2px}
.qsub{margin:-12px 0 20px;font-size:17px;font-weight:600;color:#efefef}

#pbody p{margin:0 0 15px;line-height:1.72;color:#cfcfcf}
#pbody h3{margin:26px 0 9px;font-size:1.04em;font-weight:700;color:#fff}
#pbody h4{margin:20px 0 7px;font-size:.93em;font-weight:700;color:#eaeaea}
#pbody ul,#pbody ol{margin:0 0 15px;padding-left:24px;line-height:1.72;color:#cfcfcf}
#pbody li{margin:0 0 7px}
#pbody ul ul,#pbody ol ol,#pbody ul ol,#pbody ol ul{margin:7px 0 0}
#pbody em{font-style:italic;color:#e0e0e0}
#pbody strong{color:#fff;font-weight:700}
code{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:.87em;
  background:#242424;border-radius:3px;padding:1.5px 5px;color:#e6c07b}
pre.sample{
  background:var(--code-bg);border:1px solid var(--line);border-radius:4px;
  padding:14px 16px;margin:0 0 16px;overflow-x:auto;
  font-family:"JetBrains Mono",Consolas,"Courier New",monospace;
  font-size:.86em;line-height:1.6;color:#dcdcdc;white-space:pre;
}
pre.sample code{background:none;padding:0;color:inherit}
.bar{
  background:#333;color:#dcdcdc;border-radius:3px;padding:9px 14px;margin:0 0 9px;
  font-size:.93em;font-weight:500;user-select:none;
}
.bar::before{content:"\25B6 ";font-size:10px;color:#aaa}
.bar.open::before{content:"\25BC ";}
.sublabel{font-size:.93em;font-weight:600;color:#fff;margin:14px 0 7px}
table.oa{border-collapse:collapse;margin:0 0 18px;font-size:.9em;width:auto;max-width:100%}
table.oa th,table.oa td{border:1px solid #4a4a4a;padding:7px 13px;text-align:center;color:#d8d8d8}
table.oa th{font-weight:700;color:#fff;background:#1f1f1f}
.note{border-left:3px solid #555;padding:2px 0 2px 14px;margin:0 0 16px}
.note p{margin:0}
.warn{
  border-left:3px solid var(--accent);background:#1c1710;padding:11px 15px;
  border-radius:0 4px 4px 0;margin:0 0 18px;font-size:.9em;color:#dcc9a8
}
.frag{
  font-size:.8em;color:#8a8a8a;border:1px dashed #3a3a3a;border-radius:4px;
  padding:9px 13px;margin:0 0 16px;
}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}
.tag{font-size:10.5px;letter-spacing:.04em;padding:3px 9px;border-radius:4px;
  border:1px solid #3a3a3a;color:#a8a8a8;background:#1c1c1c;white-space:nowrap}
.tag.easy{color:#4ade80;border-color:#2b5c40}
.tag.med{color:#fbbf24;border-color:#5c4a18}
.tag.hard{color:#f87171;border-color:#5c2a2a}
.srcnote{background:#1a1a1a;border:1px solid #2f2f2f;border-radius:5px;
  padding:12px 15px;margin:0 0 18px;font-size:.9em;line-height:1.65;color:#b4b4b4}
#pbody .srcnote strong{color:#e4e4e4}
.locked{border:1px dashed #4a4a4a;border-radius:5px;padding:11px 15px;margin:0 0 18px;
  font-size:.87em;color:#8a8a8a}
.cases{display:grid;gap:10px;margin:0 0 18px}
.case{border:1px solid var(--line);border-radius:5px;overflow:hidden}
.case .ch{background:#1f1f1f;padding:6px 13px;font-size:11.5px;color:#bbb;font-weight:600;
  letter-spacing:.05em}
.case pre.sample{margin:0;border:none;border-radius:0;background:#171717}
/* figures cropped out of the original screenshots into their own files */
.fig{margin:0 0 20px;max-width:660px}
.fig img{width:100%;height:auto;display:block;cursor:zoom-in;background:#0c0c0c;
  border:1px solid var(--line);border-radius:5px}
.fig img:hover{border-color:#555}
.fig figcaption{font-size:11.5px;color:#787878;margin-top:7px;font-style:italic}
.shots{display:grid;gap:14px;margin:28px 0 0;padding:20px 0 0;border-top:1px solid var(--line)}
.shots h3{margin:0 0 4px}
.shots img{width:100%;border:1px solid var(--line);border-radius:5px;background:#000;cursor:zoom-in}
.hidden{display:none!important}

/* progressive answer reveal: hints first, full solution last */
.ans{margin:30px 0 8px;padding:18px 0 0;border-top:1px solid var(--line)}
.ans > h3{margin:0 0 4px!important}
.ans .lede{font-size:.82em;color:#8a8a8a;margin:0 0 13px}
.ans details{border:1px solid var(--line);border-radius:5px;background:#161616;margin:0 0 9px;
  overflow:hidden}
.ans details[open]{background:#141414;border-color:#3d3d3d}
.ans summary{cursor:pointer;padding:10px 14px;font-size:.9em;font-weight:600;color:#d8d8d8;
  list-style:none;user-select:none;display:flex;align-items:center;gap:9px}
.ans summary::-webkit-details-marker{display:none}
.ans summary::before{content:"▶";font-size:9px;color:#777;flex:none;transition:transform .12s}
.ans details[open] > summary::before{transform:rotate(90deg)}
.ans summary:hover{color:#fff;background:#1c1c1c}
.ans summary .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#0f0f0f;
  background:#6b6b6b;border-radius:3px;padding:2px 6px;font-weight:700;flex:none}
.ans details.sol summary .k{background:var(--accent)}
.ans details.deep summary .k{background:var(--blue);color:#fff}
.ans .inner table.trace{border-collapse:collapse;margin:12px 0;font-size:.82em;width:100%;
  font-family:"JetBrains Mono",Consolas,monospace}
.ans .inner table.trace th,.ans .inner table.trace td{border:1px solid #2b2b2b;padding:5px 9px;
  text-align:left;color:#cfcfcf}
.ans .inner table.trace th{background:#1b1b1b;color:#e8e8e8;font-weight:600}
.ans .inner table.trace td.hit{background:#16201a;color:#9ecb9e}
.ans .inner .step{margin:14px 0 0;padding:0 0 0 13px;border-left:2px solid #303030}
.ans .inner .step > h4{margin:0 0 5px;font-size:.87em;color:#e8e8e8;letter-spacing:.01em}
.ans .inner .formula{font-family:"JetBrains Mono",Consolas,monospace;font-size:.8em;
  background:#111;border:1px solid #262626;border-radius:4px;padding:9px 12px;margin:9px 0;
  color:#d8d8d8;overflow-x:auto}
.ans .inner .formula b{color:var(--accent);font-weight:600}
.ans .inner{padding:2px 15px 14px;border-top:1px solid #262626}
.ans .inner > *:first-child{margin-top:12px}
.ans .inner p,.ans .inner li{font-size:.9em;line-height:1.68;color:#cfcfcf}
.ans .inner pre.sample{margin-top:12px}
.ans .cx{display:inline-block;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;
  color:#9ecb9e;background:#16201a;border:1px solid #2c422c;border-radius:3px;padding:3px 9px;
  margin:0 6px 8px 0}
.ans .unsure{font-size:12px;color:#c8a86a;border-left:3px solid #6b5424;background:#1b1710;
  padding:9px 13px;border-radius:0 4px 4px 0;margin:12px 0 0}

/* screen recording stills: one frame of the attempt, stamped with its video time */
.vshot{margin:0 0 22px}
.vshot img{width:100%;display:block;border:1px solid var(--line);border-radius:5px 5px 0 0;
  background:#000;cursor:zoom-in}
.vshot img:hover{border-color:#555}
.vshot figcaption{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-top:none;border-radius:0 0 5px 5px;
  background:#171717;padding:8px 12px;font-size:12px;line-height:1.55;color:#9a9a9a}
.vshot figcaption .ts{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;
  color:#0f0f0f;background:var(--accent);border-radius:3px;padding:2px 7px;font-weight:700;
  white-space:nowrap;flex:none}
.vshot figcaption .ts.left{background:none;color:#7a7a7a;border:1px solid #3a3a3a;font-weight:500}
.vshot figcaption b{color:#dcdcdc;font-weight:600}

/* verdict chips for the bug walk-through */
.bug{border:1px solid var(--line);border-left:3px solid #f87171;border-radius:0 5px 5px 0;
  background:#1a1616;padding:13px 16px;margin:0 0 18px}
.bug h4{margin:0 0 7px!important;color:#f87171!important;font-size:.9em}
.bug p:last-child{margin-bottom:0}
.fixed{border-left-color:#4ade80;background:#151a15}
.fixed h4{color:#4ade80!important}

/* attempt timeline */
table.tl{border-collapse:collapse;margin:0 0 20px;font-size:.87em;width:100%}
table.tl th,table.tl td{border:1px solid #3a3a3a;padding:6px 11px;text-align:left;
  color:#cfcfcf;vertical-align:top}
table.tl th{background:#1f1f1f;color:#fff;font-weight:700}
table.tl td:first-child{font-family:"JetBrains Mono",Consolas,monospace;white-space:nowrap;
  color:var(--accent);width:1%}
table.tl tr.hot td{background:#1c1614}

/* work-simulation variant */
.sim{background:#fff;color:#16191f;border-radius:6px;padding:26px 28px;margin:0 0 20px;
  font-family:"Amazon Ember","Segoe UI",Arial,sans-serif}
#pbody .sim,#pbody .sim p,#pbody .sim li,#pbody .sim strong,#pbody .sim em,
#pbody .sim h2,#pbody .sim h3{color:#16191f}
.sim h2{margin:0 0 18px;font-size:19px;font-weight:600}
.sim .quote{font-size:17px;line-height:1.6;margin:0 0 26px}
.sim .likert{display:flex;align-items:flex-end;gap:13px;margin:0 0 8px}
.sim .likert i{display:block;border:2px solid #007e7e;border-radius:6px;background:#fff}
.sim .likert i:nth-child(1){width:56px;height:22px}
.sim .likert i:nth-child(2){width:56px;height:34px}
.sim .likert i:nth-child(3){width:56px;height:46px}
.sim .likert i:nth-child(4){width:56px;height:58px}
.sim .likert i:nth-child(5){width:56px;height:70px}
.sim .likert i:hover{background:#e6f2f2;cursor:pointer}
.sim .lbl{display:flex;justify-content:space-between;max-width:352px;font-size:13.5px;color:#5f6b7a}
.inbox{background:#fff;border-radius:6px;overflow:hidden;margin:0 0 20px;max-width:460px}
.inbox .ih{background:#232f3e;color:#fff;padding:11px 16px;font-size:15px;font-weight:600}
.inbox .ib{background:#fdf6d8;padding:8px 16px;font-size:13px;color:#16191f}
.inbox .row{padding:13px 16px;border-top:1px solid #e6e6e6;color:#16191f}
#pbody .inbox .row b{display:block;font-size:14.5px;color:#16191f}
#pbody .inbox .row span{font-size:13px;color:#5f6b7a}
#pbody .inbox .row em{display:block;font-style:normal;font-size:13px;color:#007e7e;margin-top:3px}
#pbody .sim .lbl span{color:#5f6b7a}

/* ---------- editor pane ---------- */
#ehead{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:#161616;border-bottom:1px solid var(--line)
}
.langtag{
  background:#1f1f1f;border:1px solid #3a3a3a;border-radius:4px;color:#bdbdbd;
  padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.02em;flex:none
}
#vimBtn{flex:none;font-variant-numeric:tabular-nums}
#vimBtn[aria-pressed="true"]{background:#123d2c;color:#4ade80;border-color:#1c5c42}
#saved{font-size:12px;color:#5fae7f}
#sync{font-size:12px;color:#8a8a8a}
#sync.ok{color:#5fae7f}
#sync.bad{color:#f08a5d;font-weight:700}
#sync.busy{color:#d4b54a}
#efoot{
  height:44px;flex:0 0 44px;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:#161616;border-top:1px solid var(--line)
}
.pbtn{background:var(--green);color:#fff;padding:7px 17px;border-radius:4px;font-size:13px;font-weight:600}
.pbtn:hover{filter:brightness(1.1)}
#cmwrap{flex:1;min-height:0;overflow:hidden}
#code{width:100%;height:100%;background:#0b0b0b;color:#d4d4d4;border:none;outline:none;
  padding:12px 14px;font-family:var(--mono);font-size:var(--efs);
  line-height:1.6;resize:none;tab-size:4}

/* ---------- CodeMirror: Python ---------- */
.CodeMirror{height:100%;font-family:var(--mono);font-size:var(--efs);line-height:1.6;
  /* ligatures off so "->" and "!=" read exactly as typed, like a judge shows them.
     Delete this pair of lines if you prefer JetBrains Mono's arrows. */
  font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.CodeMirror-gutters{background:#0d0d0d;border-right:1px solid #232323}
.CodeMirror-linenumber{color:#4a4a4a}
.cm-s-material-darker .CodeMirror-activeline-background{background:#ffffff07}
.cm-s-material-darker .CodeMirror-activeline .CodeMirror-linenumber{color:#9a9a9a}
.CodeMirror-matchingbracket{color:var(--accent)!important;border-bottom:1px solid var(--accent)}
.CodeMirror-nonmatchingbracket{color:#ff6b6b!important}
/* the indent guides make 4-space Python blocks readable at a glance */
.cm-tab{position:relative}
.CodeMirror-cursor{border-left-width:2px}
.cm-fat-cursor .CodeMirror-cursor{background:#ffb000a0!important;border:0!important}

/* autocomplete popup */
.CodeMirror-hints{
  position:absolute;z-index:70;overflow:hidden auto;max-height:17em;margin:0;padding:4px;
  border:1px solid #3a3a3a;border-radius:6px;background:#1a1a1a;font-size:12.5px;
  font-family:var(--mono);box-shadow:0 10px 30px rgba(0,0,0,.6);list-style:none
}
.CodeMirror-hint{margin:0;padding:4px 10px;border-radius:4px;white-space:pre;color:#cfcfcf;cursor:pointer}
li.CodeMirror-hint-active{background:#1c3a5e;color:#fff}
.CodeMirror-hint .hk{float:right;margin-left:18px;font-size:10.5px;color:#6f6f6f}
li.CodeMirror-hint-active .hk{color:#9dc4ee}

/* vim's :ex and / prompts */
.CodeMirror-dialog{background:#161616;border-bottom:1px solid #333;color:#ddd;
  font-family:var(--mono);font-size:12.5px;padding:5px 10px}
.CodeMirror-dialog input{font-family:var(--mono);font-size:12.5px;color:#fff;background:transparent}
#vimStatus{font-family:var(--mono);font-size:11px;color:#7a7a7a;flex:none;letter-spacing:.06em}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50}
#drawer{
  position:fixed;left:0;top:0;bottom:0;width:392px;max-width:88vw;background:#141414;
  border-right:1px solid var(--line);z-index:51;overflow-y:auto;padding:18px 0 40px
}
#drawer h2{margin:0 0 4px;padding:0 20px;font-size:16px;color:#fff}
#drawer .sub{padding:0 20px;font-size:12px;color:var(--txt-dim);margin:0 0 16px}
#drawer .sec{padding:16px 20px 5px;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:#7a7a7a;font-weight:700}
#drawer .it{display:block;width:100%;text-align:left;padding:9px 20px;font-size:13.5px;color:#c8c8c8;line-height:1.4}
#drawer .it:hover{background:#1f1f1f;color:#fff}
#drawer .it.active{background:#1c2b44;color:#fff}
#drawer .it small{display:block;color:#777;font-size:11px;margin-top:2px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:60;
  display:grid;place-items:center;padding:20px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#444}
/* ---------- text-size control ---------- */
.fsz{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:5px;
  overflow:hidden;background:#1a1a1a}
.fsz button{padding:2px 9px;font-size:12px;color:#bbb;line-height:1.5}
.fsz button:hover{background:#262626;color:#fff}
.fsz b{font-size:10.5px;color:#777;font-weight:600;min-width:20px;text-align:center;
  font-variant-numeric:tabular-nums}

/* ---------- status buttons in the editor footer ---------- */
.stbar{display:flex;gap:6px}
.stbtn{padding:6px 12px;border-radius:5px;font-size:12.5px;color:#a8a8a8;
  border:1px solid var(--line)}
.stbtn:hover{background:#242424;color:#fff}
.stbtn[aria-pressed="true"]{font-weight:600}
.stbtn.attempt[aria-pressed="true"]{background:#3a2a12;color:#fbbf24;border-color:#5c4118}
.stbtn.solved[aria-pressed="true"]{background:#123d2c;color:#4ade80;border-color:#1c5c42}
.stbtn.review[aria-pressed="true"]{background:#40191c;color:#f87171;border-color:#5c2226}

/* ---------- notes pane under the editor ---------- */
#notes{flex:0 0 30%;min-height:0;display:flex;flex-direction:column;
  border-top:1px solid var(--line);background:#101010}
#notes .nh{flex:0 0 auto;padding:6px 12px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:#7a7a7a;font-weight:700;background:#161616;
  border-bottom:1px solid var(--line)}
#notesTa{flex:1;min-height:0;width:100%;background:#101010;color:#cfcfcf;border:none;
  outline:none;padding:10px 13px;resize:none;line-height:1.6;font-size:13.5px;
  font-family:"Amazon Ember","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#notesBtn .dot{color:var(--accent)}

/* ---------- in-browser test runner ---------- */
#runBtn.run{border-color:#2c5c3f;color:#8fd6a8}
#runBtn.run:hover{background:#14301f}
#runBtn[disabled]{opacity:.55;cursor:default}
.tbtn.tiny{padding:2px 8px;font-size:10.5px;margin-left:auto}
#tests{flex:0 0 38%;min-height:0;display:flex;flex-direction:column;
  border-top:1px solid var(--line);background:#101010}
#tests .nh{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7a7a7a;font-weight:700;
  background:#161616;border-bottom:1px solid var(--line)}
#testsMeta{letter-spacing:0;text-transform:none;font-weight:600}
#testsMeta .good{color:#4ade80}
#testsMeta .bad{color:#ff6b6b}
#testsBody{flex:1;min-height:0;overflow:auto;padding:8px 12px;font-family:var(--mono);font-size:12px}
#testsBody .case{border-left:3px solid #333;padding:5px 10px;margin:0 0 6px;background:#141414;
  border-radius:0 4px 4px 0;white-space:pre-wrap;word-break:break-word;line-height:1.55}
#testsBody .case.ok{border-left-color:#2c7a4b}
#testsBody .case.no{border-left-color:#a33}
#testsBody .case b{color:#e8e8e8;font-weight:600}
#testsBody .case .lbl{color:#7a7a7a}
#testsBody .case .exp{color:#8fd6a8}
#testsBody .case .got{color:#ff9b9b}
#testsBody .err{color:#ff9b9b;white-space:pre-wrap}
#testsBody .note{color:#7a7a7a;font-family:inherit}
#testsBody .printed{color:#8a8a8a;border-left:2px solid #2a2a2a;padding-left:8px;margin-top:4px}
#testsBody .printed .lbl{color:#5f5f5f}
#testsBody table.cx{border-collapse:collapse;margin:2px 0 8px}
#testsBody table.cx th,#testsBody table.cx td{border:1px solid #2b2b2b;padding:3px 10px;text-align:right}
#testsBody table.cx th{background:#1b1b1b;color:#ddd}
#testsBody .verdict{font-size:13px;color:#e8e8e8;margin:2px 0 8px;font-family:inherit}
#testsBody .verdict b{color:var(--accent)}
#scratch{flex:0 0 auto;display:flex;flex-direction:column;border-top:1px solid var(--line);
  background:#101010}
#scratch .nh{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:#7a7a7a;font-weight:700;background:#161616;
  border-bottom:1px solid var(--line)}
#scratch .nh .hint{letter-spacing:0;text-transform:none;font-weight:400;color:#5f5f5f}
#scratchTa{width:100%;background:#101010;color:#d4d4d4;border:none;outline:none;resize:vertical;
  padding:9px 13px;font-family:var(--mono);font-size:var(--efs);line-height:1.6}

/* ---------- drawer: search, filters, progress ---------- */
#drawer .tools{padding:0 20px 12px}
#dq{width:100%;background:#1c1c1c;border:1px solid #3a3a3a;border-radius:5px;color:#e4e4e4;
  padding:8px 11px;font-size:13.5px;outline:none;font-family:inherit}
#dq:focus{border-color:var(--blue)}
#drawer .filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
#drawer .filters button{font-size:11.5px;padding:3px 10px;border-radius:11px;
  border:1px solid var(--line);color:#9a9a9a;background:#1a1a1a}
#drawer .filters button:hover{color:#fff;border-color:#4a4a4a}
#drawer .filters button[aria-pressed="true"]{background:#1c2b44;color:#fff;border-color:#2f4c78}
.pbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#242424;
  margin:0 20px 8px}
.pbar i{display:block;height:100%}
.pbar .s{background:#1ea672}.pbar .a{background:#b8801f}.pbar .r{background:#b3494e}
#drawer .legend{padding:0 20px 14px;font-size:11.5px;color:#7a7a7a;display:flex;gap:12px;
  flex-wrap:wrap}
#drawer .legend b{font-weight:600}
#drawer .legend .s{color:#4ade80}#drawer .legend .a{color:#fbbf24}#drawer .legend .r{color:#f87171}
#drawer .sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#drawer .sec em{font-style:normal;letter-spacing:0;text-transform:none;color:#5f5f5f;
  font-size:11px;font-weight:600}
#drawer .it .mk{float:right;font-size:11px;font-weight:700}
#drawer .it .mk.s{color:#4ade80}#drawer .it .mk.a{color:#fbbf24}#drawer .it .mk.r{color:#f87171}
#drawer .none{padding:14px 20px;font-size:13px;color:#777}
#drawer .dtools{margin-top:20px;padding:16px 20px 0;border-top:1px solid var(--line);
  display:flex;gap:8px;flex-wrap:wrap}
#drawer .dtools button{font-size:12px;padding:6px 11px;border-radius:5px;color:#bbb;
  border:1px solid var(--line)}
#drawer .dtools button:hover{background:#242424;color:#fff}

@media(max-width:900px){
  #main{flex-direction:column}
  #left{flex:1 1 auto;border-right:none;border-bottom:1px solid var(--line)}
  #drag{display:none}
  #right{flex:0 0 46%}
}
</style>
</head>
<body>

<div id="top">
  <button id="burger" title="All problems (Esc)">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="smile">
    <b>amazon</b>
    <svg width="56" height="9" viewBox="0 0 56 9"><path d="M1 3c9 6 45 6 53 0" stroke="#ff9900" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M50 1l4 2-3 3z" fill="#ff9900"/></svg>
  </div>
  <div id="topTitle"></div>
  <div class="spacer"></div>
  <div id="timer" title="Click to pause / resume">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span id="tval">--:--</span>
  </div>
  <button class="tbtn" id="tReset">Reset timer</button>
  <button class="tbtn" id="drill" title="Jump to a random unsolved problem and start the clock (d)">&#127922; Drill</button>
  <button class="tbtn" id="prev">&lsaquo; Prev</button>
  <button class="tbtn" id="next">Next &rsaquo;</button>
</div>

<div id="shell">
  <div id="rail"></div>
  <div id="main">
    <div id="left">
      <div id="phead">
        <span class="eyebrow" id="eyebrow">Question Description</span>
        <span class="chip" id="chipPlat"></span>
        <span class="chip src" id="chipShots">Show original screenshots</span>
        <span class="score" id="score"></span>
        <span class="fsz" title="Problem text size">
          <button id="fsDown" aria-label="Smaller text">A&minus;</button>
          <b id="fsVal">17</b>
          <button id="fsUp" aria-label="Bigger text">A+</button>
        </span>
      </div>
      <div id="pbody"></div>
    </div>
    <div id="drag"></div>
    <div id="right">
      <div id="ehead">
        <span class="langtag">Python 3</span>
        <button class="tbtn vim" id="vimBtn" aria-pressed="false"
                title="Vim keybindings — Ctrl-Alt-V">Vim</button>
        <span class="fsz" title="Editor font size">
          <button id="efsDown" aria-label="Smaller code">A&minus;</button>
          <b id="efsVal">14</b>
          <button id="efsUp" aria-label="Bigger code">A+</button>
        </span>
        <span id="saved">Autosaved</span>
        <span id="sync" title="Server-side sync status"></span>
        <div class="spacer"></div>
        <button class="tbtn" id="reset">Reset to stub</button>
        <button class="tbtn" id="copy">Copy</button>
      </div>
      <div id="cmwrap"><textarea id="code" spellcheck="false"></textarea></div>
      <div id="notes" class="hidden">
        <div class="nh">Notes — approach, pattern, what went wrong</div>
        <textarea id="notesTa" spellcheck="true"
          placeholder="What pattern is this? What did you miss? Write it down while it stings."></textarea>
      </div>
      <div id="tests" class="hidden">
        <div class="nh">Test results <span id="testsMeta"></span>
          <button class="tbtn tiny" id="testsClose">Close</button></div>
        <div id="testsBody"></div>
      </div>
      <div id="scratch" class="hidden">
        <div class="nh">Scratch &mdash; call your function, or any Python
          <span class="hint">Shift-Ctrl-Enter to run</span>
          <button class="tbtn tiny" id="scratchClose">Close</button></div>
        <textarea id="scratchTa" spellcheck="false" rows="2"
          placeholder="getMinCost([1, 1, 2, 1, 1])"></textarea>
      </div>
      <div id="efoot">
        <button class="tbtn" id="notesBtn">Notes</button>
        <button class="tbtn run" id="runBtn">&#9654; Run tests</button>
        <button class="tbtn" id="diffBtn" title="Fuzz your code against the reference solution on random inputs">Random</button>
        <button class="tbtn" id="cxBtn" title="Time your solution on growing inputs to estimate its complexity">Big-O</button>
        <button class="tbtn" id="scratchBtn" title="Run an ad-hoc call against your code">Scratch</button>
        <div class="spacer"></div>
        <div class="stbar">
          <button class="stbtn attempt" id="stAttempt" aria-pressed="false">Attempted</button>
          <button class="stbtn solved"  id="stSolved"  aria-pressed="false">Solved</button>
          <button class="stbtn review"  id="stReview"  aria-pressed="false">Review</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/keymap/vim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
<script src="problems.js"></script>
<script src="pyenv.js"></script>
<script src="pyrun.js"></script>
<script src="app.js"></script>
</body>
</html>
