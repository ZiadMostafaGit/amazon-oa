# FastPrep practice behind the collection-dev.logic-leap.ai nginx.
#
# That server already proxies three things, and they must keep working:
#     /ws/    -> 127.0.0.1:8101   ASGI websockets
#     /sys/   -> 127.0.0.1:8770   second container
#     /       -> 127.0.0.1:8100   main app  (the catch-all, LAST in priority)
#
# This app takes /site/ only. `^~` makes nginx prefer this prefix over the
# regex locations, and there is deliberately NO trailing slash on proxy_pass,
# so /site/api/... reaches the container unchanged — the app detects the mount
# point and strips it itself.
#
# Replace the existing /site/ block with this one, and delete the /images/ and
# /video/ blocks: they served the old app's screenshots and now belong to the
# main app at /.

location = /site {
    return 301 /site/;
}

location ^~ /site/ {
    proxy_pass http://127.0.0.1:8900;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /site;

    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Running code is synchronous: the sandbox may hold a request for the full
    # 10-second wall-clock limit before answering. 90s of headroom is plenty
    # and keeps a stuck request from hanging a worker forever.
    proxy_connect_timeout 15;
    proxy_send_timeout    90;
    proxy_read_timeout    90;

    # Source screenshots are up to ~1 MB and the editor posts whole files.
    client_max_body_size 8m;
    proxy_buffering on;
}
