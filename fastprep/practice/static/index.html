<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastPrep practice</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="vendor/codemirror/theme/material-darker.min.css">
<link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.min.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="vendor/fonts/jetbrains-mono.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="top">
  <button id="menuBtn" class="icon" title="Filters (f)">≡</button>
  <b class="brand">FastPrep <span>practice</span></b>
  <div class="search">
    <input id="q" type="search" placeholder="Search titles and statements…" autocomplete="off" spellcheck="false">
  </div>
  <span id="count" class="count"></span>
  <label class="sortwrap">sort
    <select id="sort"></select>
    <button id="dir" class="dirbtn" title="Reverse the order (r)">↓</button>
  </label>
  <span id="env" class="env" title="Execution environment"></span>
</header>

<div id="shell">
  <aside id="filters">
    <div class="fhead">
      <b>Filters</b>
      <button id="clearAll" class="link">clear all</button>
    </div>
    <div id="activeChips" class="chips"></div>
    <div id="facets"></div>
  </aside>

  <main id="main">
    <section id="listPane">
      <div id="list"></div>
      <div id="more"></div>
    </section>
    <section id="detailPane" class="empty">
      <div class="placeholder">Pick a problem on the left.</div>
    </section>
  </main>
</div>

<div id="lightbox" hidden><img alt="source screenshot"></div>

<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/python/python.min.js"></script>
<script src="vendor/codemirror/addon/edit/closebrackets.min.js"></script>
<script src="vendor/codemirror/addon/edit/matchbrackets.min.js"></script>
<script src="vendor/codemirror/addon/comment/comment.min.js"></script>
<script src="vendor/codemirror/addon/selection/active-line.min.js"></script>
<script src="vendor/codemirror/addon/hint/show-hint.min.js"></script>
<script src="vendor/codemirror/addon/dialog/dialog.min.js"></script>
<script src="vendor/codemirror/addon/search/searchcursor.min.js"></script>
<script src="vendor/codemirror/keymap/vim.min.js"></script>
<script src="vendor/codemirror/addon/search/search.min.js"></script>
<script src="vendor/codemirror/addon/search/jump-to-line.min.js"></script>
<script src="pyenv.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
